<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07111f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sat Map">
    <title>Satellite Map</title>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://tile.openstreetmap.org">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <div id="map" aria-label="Live satellite map"></div>

      <header class="topbar">
        <div>
          <p class="eyebrow">Live orbital view</p>
          <h1>Satellite Map</h1>
        </div>
        <button id="refresh-button" class="icon-button" type="button" aria-label="Reload satellite list">↻</button>
      </header>

      <section id="status-panel" class="status-panel" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Loading satellites…</span>
      </section>

      <label class="track-legend" for="ground-track-toggle">
        <span class="track-sample"></span>
        <span>Ground paths</span>
        <input id="ground-track-toggle" type="checkbox" checked>
        <span class="toggle" aria-hidden="true"></span>
      </label>

      <section id="detail-panel" class="detail-panel" aria-live="polite">
        <div class="detail-handle"></div>
        <div class="detail-heading">
          <div>
            <p class="eyebrow">Selected satellite</p>
            <h2 id="detail-name">Tap a satellite</h2>
          </div>
          <button id="clear-selection" class="text-button" type="button">Clear</button>
        </div>
        <div id="empty-detail" class="empty-detail">
          Select one satellite for details, or two to compare their separation.
        </div>
        <div id="satellite-detail" class="metrics" hidden>
          <div><span>Altitude</span><strong id="detail-altitude">—</strong></div>
          <div><span>Speed</span><strong id="detail-speed">—</strong></div>
          <div><span>Latitude</span><strong id="detail-latitude">—</strong></div>
          <div><span>Longitude</span><strong id="detail-longitude">—</strong></div>
          <div><span>Inclination</span><strong id="detail-inclination">—</strong></div>
          <div><span>Launch date</span><strong id="detail-launch-date">—</strong></div>
        </div>
        <div id="separation-detail" class="separation" hidden>
          <span id="separation-label">Separation</span>
          <strong id="separation-distance">—</strong>
          <small>Straight-line distance through 3D space</small>
        </div>
        <p id="data-age" class="data-age"></p>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
